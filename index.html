<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyidi Bazar Hub</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div id="loading-overlay" style="position:fixed;inset:0;background:#0b0b1a;display:flex;align-items:center;justify-content:center;z-index:999999;">
        <div style="text-align:center;">
            <div style="width:50px;height:50px;border:5px solid #333;border-top:5px solid #00f0ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px;"></div>
            <div style="font-size:12px;color:#00f0ff;letter-spacing:2px;font-weight:bold;" id="loader-status-text">LOADING...</div>
        </div>
    </div>
    
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0b1a; font-family:'Inter',sans-serif; color:#fff; }
    </style>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log("🚀 Loading code.json...");
            
            fetch('code.json')
                .then(response => {
                    if (!response.ok) throw new Error('code.json not found');
                    return response.json();
                })
                .then(data => {
                    console.log("✅ code.json loaded!");
                    
                    // ===== FIREBASE INIT =====
                    firebase.initializeApp(data.config.firebase);
                    
                    // ===== LOADING HATAAO =====
                    document.getElementById('loading-overlay').style.display = 'none';
                    
                    // ===== HTML INJECT =====
                    document.body.innerHTML = data.html;
                    
                    // ===== CSS INJECT =====
                    const style = document.createElement('style');
                    style.textContent = data.css;
                    document.head.appendChild(style);
                    
                    // ===== JS EXECUTE =====
                    eval(data.js);
                    
                    console.log("🎉 App Loaded!");
                })
                .catch(err => {
                    console.error("❌ Error:", err);
                    document.getElementById('loading-overlay').innerHTML = `
                        <div style="text-align:center;color:#ff4444;padding:20px;">
                            <div style="font-size:40px;">⚠️</div>
                            <div style="font-size:14px;margin-top:10px;">${err.message}</div>
                            <button onclick="location.reload()" style="margin-top:15px;padding:10px 30px;background:#00f0ff;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">RETRY</button>
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
