    <title>NightOrbit OmniScan</title>

    <!-- QR Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ================================================================
           HEAVY OMNISCAN — DEEP BLACK FORENSIC EDITION
           No extra UI, pure scanner with security
           ================================================================ */

        :root {
            --cyan: #00f0ff;
            --pink: #ff2d95;
            --purple: #b400ff;
            --gold: #ffd700;
            --green: #39ff14;
            --red: #ff073a;
            --dark: #000000;
            --card: rgba(10, 12, 24, 0.92);
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(0, 240, 255, 0.06);
            --text: #f0f0f8;
            --muted: #6a6a8a;
            --radius: 28px;
            --radius-sm: 16px;
            --shadow: 0 40px 120px rgba(0,0,0,0.9);
            --transition: 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; min-height:100vh;
            background:var(--dark);
            font-family:'Inter','Segoe UI',system-ui,sans-serif;
            color:var(--text);
            overflow-x:hidden;
            -webkit-user-select:none;
            user-select:none;
        }
        ::-webkit-scrollbar { width:3px; height:3px; }
        ::-webkit-scrollbar-track { background:rgba(255,255,255,0.01); }
        ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--cyan),var(--purple)); border-radius:10px; }

        .app-container {
            display:flex; flex-direction:column; min-height:100vh;
            width:100%; max-width:100vw;
            padding:14px;
            background:radial-gradient(ellipse at 20% 30%, #0a0a1a 0%, #000000 80%);
            position:relative;
            overflow-x:hidden;
        }

        /* Status Bar */
        .status-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:8px 16px; margin-bottom:12px;
            background:rgba(0,0,0,0.6);
            border-radius:var(--radius-sm);
            border:1px solid rgba(255,255,255,0.02);
            flex-wrap:wrap; gap:6px;
        }
        .status-bar .brand { display:flex; align-items:center; gap:8px; }
        .status-bar .brand .icon {
            width:30px; height:30px; border-radius:10px;
            background:linear-gradient(135deg,var(--cyan),var(--purple));
            display:flex; align-items:center; justify-content:center;
            font-size:12px; color:#000; font-weight:900;
            box-shadow:0 0 30px rgba(0,240,255,0.15);
            flex-shrink:0;
        }
        .status-bar .brand .name {
            font-size:13px; font-weight:700;
            background:linear-gradient(135deg,var(--cyan),var(--pink));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            letter-spacing:0.5px;
        }
        .status-bar .brand .sub {
            font-size:7px; color:var(--muted);
            letter-spacing:2px; text-transform:uppercase;
            display:block; margin-top:-1px;
        }
        .status-badge {
            display:inline-flex; align-items:center; gap:5px;
            padding:3px 12px; border-radius:50px;
            font-size:7px; font-weight:700; text-transform:uppercase;
            letter-spacing:0.8px; border:1px solid transparent;
            transition:var(--transition);
            flex-shrink:0;
        }
        .status-badge.idle { background:rgba(255,255,255,0.02); color:var(--muted); border-color:rgba(255,255,255,0.03); }
        .status-badge.scanning { background:rgba(0,240,255,0.06); color:var(--cyan); border-color:rgba(0,240,255,0.12); animation:pulseBadge 1.5s infinite; }
        .status-badge.success { background:rgba(57,255,20,0.06); color:var(--green); border-color:rgba(57,255,20,0.12); }
        .status-badge.error { background:rgba(255,7,58,0.06); color:var(--red); border-color:rgba(255,7,58,0.12); }
        @keyframes pulseBadge { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }
        .status-badge .dot { width:5px; height:5px; border-radius:50%; background:currentColor; }

        /* Scanner Viewfinder */
        #scanner-container {
            position:relative; width:100%; aspect-ratio:1/1;
            max-width:560px; margin:0 auto;
            background:#05070c;
            border-radius:var(--radius);
            overflow:hidden;
            border:1.5px solid var(--border);
            box-shadow:0 0 100px rgba(0,240,255,0.02), inset 0 0 100px rgba(0,0,0,0.6);
        }
        #scanner-container video { width:100% !important; height:100% !important; object-fit:cover !important; }
        #scanner-container #qr-reader { width:100% !important; height:100% !important; }

        .scan-overlay {
            position:absolute; inset:0; pointer-events:none; z-index:5;
        }
        .scan-overlay .corner {
            position:absolute; width:26px; height:26px;
            border-color:var(--cyan); border-style:solid; border-width:0;
            opacity:0.35;
        }
        .scan-overlay .corner.tl { top:14px; left:14px; border-top-width:2.5px; border-left-width:2.5px; }
        .scan-overlay .corner.tr { top:14px; right:14px; border-top-width:2.5px; border-right-width:2.5px; }
        .scan-overlay .corner.bl { bottom:14px; left:14px; border-bottom-width:2.5px; border-left-width:2.5px; }
        .scan-overlay .corner.br { bottom:14px; right:14px; border-bottom-width:2.5px; border-right-width:2.5px; }

        .scan-line {
            position:absolute; left:10%; right:10%; height:2px;
            background:linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
            top:15%; z-index:6; opacity:0.25;
            animation:scanMove 3.6s ease-in-out infinite;
            box-shadow:0 0 40px rgba(0,240,255,0.08);
        }
        @keyframes scanMove { 0%,100%{ top:12%; opacity:0.15; } 50%{ top:82%; opacity:0.5; } }

        .scanner-status-overlay {
            position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
            z-index:10; background:rgba(0,0,0,0.75);
            backdrop-filter:blur(20px);
            padding:5px 16px; border-radius:50px;
            border:1px solid rgba(255,255,255,0.03);
            display:flex; align-items:center; gap:8px;
            font-size:8px; font-weight:500; color:var(--muted);
            letter-spacing:0.3px; white-space:nowrap; flex-wrap:wrap; justify-content:center;
        }
        .scanner-status-overlay .dot {
            width:5px; height:5px; border-radius:50%; background:var(--muted);
            transition:0.3s;
        }
        .scanner-status-overlay .dot.active {
            background:var(--cyan);
            box-shadow:0 0 20px rgba(0,240,255,0.3);
            animation:dotPulse 1.2s infinite;
        }
        @keyframes dotPulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:0.3; transform:scale(0.7); } }
        .scanner-status-overlay .format-hint {
            font-size:6px; opacity:0.25; letter-spacing:1px; text-transform:uppercase;
            border-left:1px solid rgba(255,255,255,0.04);
            padding-left:8px;
        }

        /* Controls */
        .control-matrix {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
            gap:6px; margin-top:12px; padding:2px;
        }
        .btn-matrix {
            display:inline-flex; align-items:center; gap:5px;
            padding:8px 14px; border-radius:var(--radius-sm);
            border:1px solid var(--border);
            background:var(--glass); color:var(--muted);
            font-size:9px; font-weight:600; text-transform:uppercase;
            letter-spacing:0.5px; cursor:pointer;
            transition:var(--transition);
            backdrop-filter:blur(10px);
            font-family:inherit; flex-shrink:0;
        }
        .btn-matrix:hover { background:rgba(0,240,255,0.04); border-color:rgba(0,240,255,0.15); color:#fff; transform:translateY(-1px); }
        .btn-matrix.active { background:rgba(0,240,255,0.06); border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 30px rgba(0,240,255,0.02); }
        .btn-matrix .icon { font-size:11px; }
        .btn-upload-matrix { position:relative; overflow:hidden; cursor:pointer; }
        .btn-upload-matrix input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .btn-install {
            background:rgba(0,240,255,0.04);
            border-color:var(--cyan);
            color:var(--cyan);
        }
        .btn-install:hover {
            background:rgba(0,240,255,0.08);
            border-color:var(--cyan);
            box-shadow:0 0 40px rgba(0,240,255,0.04);
        }
        .btn-install.hidden { display:none !important; }

        /* Result Popup */
        #result-overlay {
            position:fixed; inset:0;
            background:rgba(0,0,0,0.94);
            backdrop-filter:blur(40px) saturate(1.4);
            z-index:20000; display:none;
            align-items:center; justify-content:center; padding:16px;
            animation:overlayIn 0.4s ease;
        }
        #result-overlay.active { display:flex; }
        @keyframes overlayIn { 0%{ opacity:0; transform:scale(0.94); } 100%{ opacity:1; transform:scale(1); } }
        .result-popup {
            background:var(--card);
            backdrop-filter:blur(60px) saturate(1.8);
            border-radius:var(--radius);
            padding:28px 24px 22px;
            max-width:460px; width:100%; max-height:88vh;
            overflow-y:auto;
            border:1px solid var(--border);
            box-shadow:var(--shadow), 0 0 80px rgba(0,240,255,0.02);
            position:relative;
            animation:popupIn 0.45s ease;
        }
        @keyframes popupIn { 0%{ opacity:0; transform:translateY(16px) scale(0.94); } 100%{ opacity:1; transform:translateY(0) scale(1); } }
        .result-popup::before {
            content:''; position:absolute; inset:-1px; border-radius:var(--radius);
            padding:1px; background:conic-gradient(from 0deg, var(--cyan), var(--gold), var(--purple), var(--cyan));
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude;
            pointer-events:none; animation:borderSpin 8s linear infinite;
        }
        @keyframes borderSpin { 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }
        .result-popup .close-popup {
            position:absolute; top:10px; right:10px;
            background:rgba(255,255,255,0.02);
            border:1px solid rgba(255,255,255,0.04);
            color:var(--muted); width:32px; height:32px;
            border-radius:50%; font-size:14px; cursor:pointer;
            transition:var(--transition);
            display:flex; align-items:center; justify-content:center;
            z-index:10; font-family:inherit; flex-shrink:0;
        }
        .result-popup .close-popup:hover {
            background:rgba(0,240,255,0.04);
            border-color:var(--cyan);
            color:var(--cyan);
            transform:rotate(90deg);
        }
        .result-popup .icon-row { text-align:center; font-size:36px; margin-bottom:2px; display:block; }
        .result-popup .title-row {
            text-align:center; font-size:16px; font-weight:800;
            background:linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            letter-spacing:0.5px; margin-bottom:2px;
        }
        .result-popup .sub-row {
            text-align:center; font-size:10px; color:var(--muted);
            margin-bottom:12px; letter-spacing:0.3px;
        }
        .result-popup .format-badge {
            display:inline-block; padding:2px 12px; border-radius:50px;
            font-size:8px; font-weight:700; text-transform:uppercase;
            letter-spacing:0.8px; background:rgba(0,240,255,0.04);
            color:var(--cyan); border:1px solid rgba(0,240,255,0.06);
            margin-bottom:12px; text-align:center; width:100%;
        }
        .result-popup .data-body {
            background:rgba(0,0,0,0.4); border-radius:var(--radius-sm);
            padding:14px 16px; border:1px solid rgba(255,255,255,0.02);
            max-height:250px; overflow-y:auto;
            font-size:12px; line-height:1.7; color:var(--text);
            word-break:break-all;
        }
        .result-popup .data-body .label {
            color:var(--muted); font-size:8px;
            text-transform:uppercase; letter-spacing:0.6px;
            display:block; margin-top:5px;
        }
        .result-popup .data-body .label:first-child { margin-top:0; }
        .result-popup .data-body .value { font-weight:500; color:#f0f0f8; }
        .result-popup .data-body .value.cyan { color:var(--cyan); }
        .result-popup .data-body .value.gold { color:var(--gold); }
        .result-popup .data-body .value.green { color:var(--green); }
        .result-popup .data-body .raw-data {
            background:#0a0a0a; padding:8px; border-radius:8px;
            font-size:11px; word-break:break-all; max-height:120px;
            overflow-y:auto; color:#aaa; font-family:monospace;
            margin-top:8px; border:1px solid rgba(255,255,255,0.02);
        }
        .result-popup .action-grid {
            display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;
        }
        .result-popup .action-grid .act {
            flex:1; min-width:70px; padding:8px 14px;
            border-radius:var(--radius-sm); border:none;
            font-weight:700; font-size:9px; text-transform:uppercase;
            letter-spacing:0.5px; cursor:pointer;
            transition:var(--transition);
            display:inline-flex; align-items:center; justify-content:center;
            gap:5px; font-family:inherit;
        }
        .result-popup .action-grid .act-primary {
            background:linear-gradient(135deg, var(--cyan), var(--purple));
            color:#000;
        }
        .result-popup .action-grid .act-primary:hover {
            transform:translateY(-2px);
            box-shadow:0 8px 30px rgba(0,240,255,0.2);
        }
        .result-popup .action-grid .act-secondary {
            background:var(--glass); color:var(--muted);
            border:1px solid var(--border);
        }
        .result-popup .action-grid .act-secondary:hover {
            background:rgba(255,255,255,0.04); color:#fff;
            border-color:rgba(255,255,255,0.08);
        }

        /* Toast */
        #toast {
            position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
            background:var(--card); backdrop-filter:blur(40px);
            padding:10px 20px; border-radius:var(--radius-sm);
            border:1px solid var(--border); box-shadow:var(--shadow);
            z-index:9999; display:none;
            font-size:11px; color:var(--text);
            max-width:92%; text-align:center;
            animation:toastIn 0.4s ease;
        }
        #toast.show { display:block; }
        @keyframes toastIn { 0%{ opacity:0; transform:translateX(-50%) translateY(14px) scale(0.94); } 100%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }

        /* No extra banners or menus */

        @media (max-width:480px) {
            .app-container { padding:10px; }
            .result-popup { padding:20px 16px 18px; max-width:100%; }
            .control-matrix .btn-matrix { padding:6px 10px; font-size:8px; }
        }
        @media (min-width:768px) {
            #scanner-container { aspect-ratio:1/1; max-width:520px; }
        }
    </style>
</head>
<body>

    <!-- ===== TOAST ===== -->
    <div id="toast"></div>

    <!-- ===== RESULT OVERLAY ===== -->
    <div id="result-overlay">
        <div class="result-popup">
            <button class="close-popup" onclick="closeResultPopup()"><i class="fa-solid fa-xmark"></i></button>
            <span class="icon-row" id="res-icon">📱</span>
            <div class="title-row" id="res-title">Scan Result</div>
            <div class="sub-row" id="res-sub">Decoded payload</div>
            <div style="text-align:center; margin-bottom:10px;">
                <span class="format-badge" id="res-format">QR Code</span>
            </div>
            <div class="data-body" id="res-body"></div>
            <div class="action-grid" id="res-actions"></div>
        </div>
    </div>

    <!-- ================================================================ MAIN APP ================================================================ -->
    <div class="app-container">

        <!-- ===== STATUS BAR ===== -->
        <div class="status-bar">
            <div class="brand">
                <div class="icon"><i class="fa-solid fa-qrcode"></i></div>
                <div>
                    <span class="name">NightOrbit</span>
                    <span class="sub">OmniScan · Forensic</span>
                </div>
            </div>
            <div class="status-badge idle" id="status-badge">
                <span class="dot"></span>
                <span id="status-text">Idle</span>
            </div>
        </div>

        <!-- ===== SCANNER ===== -->
        <div id="scanner-container">
            <div id="qr-reader"></div>
            <div class="scan-overlay">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <div class="scan-line"></div>
            <div class="scanner-status-overlay">
                <span class="dot" id="scanner-dot"></span>
                <span id="scanner-status-text">Ready</span>
                <span class="format-hint" id="format-hint">QR · AZTEC · DM · PDF417 · EAN · UPC · CODE39 · CODE128 · ITF</span>
            </div>
        </div>

        <!-- ===== CONTROLS ===== -->
        <div class="control-matrix">
            <button class="btn-matrix active" id="btn-camera" onclick="toggleCamera()">
                <span class="icon"><i class="fa-solid fa-camera"></i></span> Camera
            </button>
            <label class="btn-matrix btn-upload-matrix">
                <span class="icon"><i class="fa-solid fa-upload"></i></span> Upload
                <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)" />
            </label>
            <button class="btn-matrix" onclick="resetScanner()">
                <span class="icon"><i class="fa-solid fa-rotate-right"></i></span> Reset
            </button>
            <button class="btn-matrix" id="btn-torch" onclick="toggleTorch()">
                <span class="icon"><i class="fa-solid fa-lightbulb"></i></span> Torch
            </button>
            <!-- ===== INSTALL BUTTON (no download) ===== -->
            <button class="btn-matrix btn-install" id="install-btn" onclick="installApp()">
                <span class="icon"><i class="fa-solid fa-mobile-screen-button"></i></span> Install
            </button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div style="text-align:center; padding:10px 0 2px; font-size:7px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; opacity:0.25; border-top:1px solid rgba(255,255,255,0.015); margin-top:14px;">
            <i class="fa-solid fa-shield-halved" style="margin-right:6px; color:var(--cyan);"></i>
            NightOrbit OmniScan · Forensic Grade · v3.0 · PWA
        </div>

    </div>

    <!-- ================================================================ JAVASCRIPT ================================================================ -->
    <script>
        // ============================================================
        //  ANTI-TAMPER SHIELD — FULL HEAVY
        // ============================================================
        (function() {
            'use strict';
            if (window.location.search.includes('debug=1')) { console.log('🔓 Debug mode'); return; }
            document.addEventListener('contextmenu', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                e.preventDefault();
                e.stopPropagation();
                return false;
            });

            function blockKey(e) {
                if (e.key && e.key.startsWith('F') && e.key.length <= 3) {
                    var fNum = parseInt(e.key.replace('F', ''));
                    if (fNum >= 1 && fNum <= 12) { e.preventDefault();
                        e.stopPropagation(); return false; }
                }
                if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault();
                    e.stopPropagation(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.keyCode === 73 || e
                        .keyCode === 74 || e.keyCode === 67)) { e.preventDefault();
                    e.stopPropagation(); return false; }
                if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) { e.preventDefault();
                    e.stopPropagation(); return false; }
                if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) { e.preventDefault();
                    e.stopPropagation(); return false; }
                if (e.key === 'PrintScreen' || e.keyCode === 44) { e.preventDefault();
                    e.stopPropagation(); return false; }
                if (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'j' || e.key === 'c' || e.keyCode === 73 || e
                        .keyCode === 74 || e.keyCode === 67)) { e.preventDefault();
                    e.stopPropagation(); return false; }
                return true;
            }
            document.addEventListener('keydown', blockKey, true);
            window.addEventListener('keydown', blockKey, true);

            var noop = function() {};
            var cm = ['log', 'warn', 'error', 'info', 'debug', 'trace', 'group', 'groupEnd', 'table', 'clear', 'dir',
                'dirxml', 'profile', 'profileEnd', 'time', 'timeEnd', 'timeStamp', 'memory', 'assert', 'count',
                'countReset'
            ];
            for (var i = 0; i < cm.length; i++) { try { window.console[cm[i]] = noop; } catch (e) {} }
            window.console.clear = noop;
            try { delete window.eval;
                window.eval = function() { return null; };
                Object.defineProperty(window, 'eval', { value: function() { return null; }, writable: false,
                    configurable: false }); } catch (e) {}
            var ost = window.setTimeout;
            window.setTimeout = function(fn, d) { if (typeof fn === 'string') return; return ost(fn, d); };
            var osi = window.setInterval;
            window.setInterval = function(fn, d) { if (typeof fn === 'string') return; return osi(fn, d); };
            document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
            document.addEventListener('selectstart', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                e.preventDefault();
                return false;
            });
            document.addEventListener('copy', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                e.preventDefault();
                return false;
            });
            document.addEventListener('cut', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                e.preventDefault();
                return false;
            });
            document.addEventListener('paste', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                e.preventDefault();
                return false;
            });
            document.addEventListener('auxclick', function(e) { if (e.button === 1) { e.preventDefault(); return false; } });
            setInterval(function() {
                var threshold = 100;
                if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight >
                    threshold) { try { console.clear(); } catch (e) {} }
            }, 500);
            try { document.write = function() { return; };
                window.print = function() { return; }; } catch (e) {}
            console.log('✅ Heavy Anti-Tamper Active');
        })();

        // ============================================================
        //  HTTPS REDIRECT (SILENT)
        // ============================================================
        (function() {
            if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost') {
                window.location.replace('https://' + window.location.host + window.location.pathname + window.location
                    .search);
            }
        })();

        // ============================================================
        //  TOAST
        // ============================================================
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg, type) {
            type = type || 'info';
            toastEl.textContent = msg;
            toastEl.className = 'show ' + type;
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, 3200);
        }

        // ============================================================
        //  OMNISCAN QR ENGINE — FULL HEAVY
        // ============================================================
        (function() {
            'use strict';

            let html5QrCode = null;
            let isScanning = false;
            let cameraActive = false;
            let torchOn = false;
            let scanLog = [];
            let isProcessingResult = false;
            let scannerInitialized = false;

            const statusBadge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');
            const scannerDot = document.getElementById('scanner-dot');
            const scannerStatusText = document.getElementById('scanner-status-text');
            const formatHint = document.getElementById('format-hint');
            const btnCamera = document.getElementById('btn-camera');
            const btnTorch = document.getElementById('btn-torch');

            const resultOverlay = document.getElementById('result-overlay');
            const resIcon = document.getElementById('res-icon');
            const resTitle = document.getElementById('res-title');
            const resSub = document.getElementById('res-sub');
            const resFormat = document.getElementById('res-format');
            const resBody = document.getElementById('res-body');
            const resActions = document.getElementById('res-actions');

            function setStatus(state, msg) {
                statusBadge.className = 'status-badge ' + state;
                if (msg) statusText.textContent = msg;
                if (state === 'scanning') {
                    scannerDot.className = 'dot active';
                    scannerStatusText.textContent = msg || 'Scanning...';
                } else if (state === 'success') {
                    scannerDot.className = 'dot';
                    scannerDot.style.background = '#39ff14';
                    scannerDot.style.boxShadow = '0 0 16px rgba(57,255,20,0.3)';
                    scannerStatusText.textContent = msg || 'Detected';
                } else if (state === 'error') {
                    scannerDot.className = 'dot';
                    scannerDot.style.background = '#ff073a';
                    scannerDot.style.boxShadow = '0 0 16px rgba(255,7,58,0.3)';
                    scannerStatusText.textContent = msg || 'Error';
                } else {
                    scannerDot.className = 'dot';
                    scannerDot.style.background = '';
                    scannerDot.style.boxShadow = '';
                    scannerStatusText.textContent = msg || 'Ready';
                }
            }

            function initScanner() {
                if (html5QrCode) { try { html5QrCode.clear(); } catch (e) {} html5QrCode = null;
                    scannerInitialized = false; }
                try {
                    html5QrCode = new Html5Qrcode('qr-reader');
                    scannerInitialized = true;
                    startCamera();
                } catch (e) {
                    showToast('❌ Scanner init error: ' + e.message, 4000);
                    setStatus('error', 'Init failed');
                }
            }

            function startCamera() {
                if (!html5QrCode) { initScanner(); return; }
                if (cameraActive) return;
                if (!scannerInitialized) { initScanner(); return; }

                var config = {
                    fps: 30,
                    qrbox: { width: 240, height: 240 },
                    aspectRatio: 1.0,
                    disableFlip: false,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.AZTEC,
                        Html5QrcodeSupportedFormats.DATA_MATRIX,
                        Html5QrcodeSupportedFormats.PDF417,
                        Html5QrcodeSupportedFormats.MAXICODE,
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.CODE_93,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODABAR,
                        Html5QrcodeSupportedFormats.ITF,
                        Html5QrcodeSupportedFormats.RSS_14,
                        Html5QrcodeSupportedFormats.RSS_EXPANDED
                    ]
                };

                html5QrCode.start({ facingMode: 'environment' }, config, onScanSuccess, onScanError)
                    .then(function() {
                        cameraActive = true;
                        isScanning = true;
                        setStatus('scanning', 'Scanning...');
                        btnCamera.classList.add('active');
                        btnCamera.innerHTML = '<span class="icon"><i class="fa-solid fa-camera"></i></span> Camera';
                        formatHint.textContent = 'QR · AZTEC · DM · PDF417 · EAN · UPC · CODE39 · CODE128 · ITF · RSS';
                        showToast('📷 Multi-format scanner live', 1600);
                    }).catch(function(err) {
                        showToast('❌ Camera error: ' + err.message, 4000);
                        setStatus('error', 'Camera unavailable');
                        cameraActive = false;
                        isScanning = false;
                        btnCamera.classList.remove('active');
                    });
            }

            function stopCamera() {
                if (html5QrCode && cameraActive) {
                    html5QrCode.stop().then(function() {
                        cameraActive = false;
                        isScanning = false;
                        setStatus('idle', 'Camera stopped');
                        btnCamera.classList.remove('active');
                        btnCamera.innerHTML = '<span class="icon"><i class="fa-solid fa-camera"></i></span> Camera';
                        showToast('📷 Camera stopped', 1200);
                    }).catch(function() {});
                }
            }

            window.toggleCamera = function() {
                if (cameraActive) { stopCamera(); } else { startCamera(); }
            };

            window.toggleTorch = function() {
                if (!html5QrCode || !cameraActive) { showToast('⚠️ Start camera first', 1500); return; }
                torchOn = !torchOn;
                try {
                    html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
                    btnTorch.classList.toggle('active', torchOn);
                    btnTorch.innerHTML = '<span class="icon"><i class="fa-solid fa-lightbulb"></i></span> ' + (torchOn ?
                        'On' : 'Torch');
                    showToast(torchOn ? '🔦 Torch on' : '🔦 Torch off', 1000);
                } catch (e) {
                    showToast('⚠️ Torch not supported', 1500);
                    torchOn = false;
                    btnTorch.classList.remove('active');
                }
            };

            window.resetScanner = function() {
                stopCamera();
                setTimeout(function() {
                    if (html5QrCode) { try { html5QrCode.clear(); } catch (e) {} html5QrCode = null;
                        scannerInitialized = false; }
                    document.getElementById('qr-reader').innerHTML = '';
                    closeResultPopup();
                    setTimeout(function() { initScanner();
                        showToast('🔄 Scanner reset', 1200); }, 400);
                }, 400);
            };

            window.handleFileUpload = function(event) {
                var file = event.target.files[0];
                if (!file) return;
                var wasScanning = isScanning;
                if (wasScanning) stopCamera();

                showToast('📤 Processing image...', 2000);
                setStatus('scanning', 'Processing file...');

                var tempReader = new Html5Qrcode('qr-reader');
                tempReader.scanFile(file, true)
                    .then(function(decodedText) {
                        setStatus('success', 'File scanned!');
                        try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
                        forensicParse(decodedText, 'file');
                        tempReader.clear();
                        if (wasScanning) {
                            setTimeout(function() {
                                if (html5QrCode) { try { html5QrCode.clear(); } catch (e) {} html5QrCode =
                                        null;
                                    scannerInitialized = false; }
                                document.getElementById('qr-reader').innerHTML = '';
                                setTimeout(function() { initScanner();
                                    showToast('🔄 Scanner restarted', 1000); }, 300);
                            }, 500);
                        }
                    })
                    .catch(function(err) {
                        showToast('❌ QR read failed: ' + err.message, 3500);
                        setStatus('error', 'File scan failed');
                        tempReader.clear();
                        if (wasScanning) {
                            setTimeout(function() {
                                if (html5QrCode) { try { html5QrCode.clear(); } catch (e) {} html5QrCode =
                                        null;
                                    scannerInitialized = false; }
                                document.getElementById('qr-reader').innerHTML = '';
                                setTimeout(function() { initScanner(); }, 300);
                            }, 400);
                        }
                    });
                event.target.value = '';
            };

            function onScanSuccess(decodedText) {
                if (!isScanning || isProcessingResult) return;
                isProcessingResult = true;
                try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
                setStatus('success', 'QR detected!');
                if (html5QrCode && cameraActive) { try { html5QrCode.pause(true); } catch (e) {} }
                forensicParse(decodedText, 'camera');
            }

            function onScanError() {}

            window.closeResultPopup = function() {
                resultOverlay.classList.remove('active');
                isProcessingResult = false;
                setTimeout(function() {
                    if (html5QrCode && cameraActive) {
                        try { html5QrCode.resume();
                            isScanning = true;
                            setStatus('scanning', 'Scanning...'); } catch (e) {
                            try { html5QrCode.clear(); } catch (ex) {}
                            html5QrCode = null;
                            scannerInitialized = false;
                            document.getElementById('qr-reader').innerHTML = '';
                            setTimeout(function() { initScanner(); }, 400);
                        }
                    } else if (!cameraActive) { startCamera(); }
                }, 300);
            };

            // ============================================================
            //  HEAVY FORENSIC PARSER — FULL RAW DATA
            // ============================================================
            function forensicParse(raw, source) {
                var trimmed = raw.trim();
                var detectedFormat = 'Unknown';
                if (/^WIFI:/i.test(trimmed)) detectedFormat = 'Wi-Fi Profile';
                else if (/BEGIN:VCARD/i.test(trimmed)) detectedFormat = 'vCard / Contact';
                else if (/^https?:\/\/[^\s]+/.test(trimmed)) detectedFormat = 'Hyperlink / URL';
                else if (/^[0-9]{13}$/.test(trimmed)) detectedFormat = 'EAN-13';
                else if (/^[A-Za-z0-9\+\/=]{20,}$/.test(trimmed)) detectedFormat = 'Base64 / Hash';
                else if (/^[0-9A-Fa-f]{32,}$/.test(trimmed)) detectedFormat = 'Hex / MD5';
                else if (/^[A-Za-z0-9\-_]{16,}$/.test(trimmed)) detectedFormat = 'Crypto Token';

                const rawHtml = `<div class="raw-data"><b style="color:var(--gold);">🔍 Raw Decoded Data:</b><br>${trimmed}</div>`;

                // Wi-Fi
                if (/^WIFI:/i.test(trimmed)) {
                    var ssidMatch = trimmed.match(/S:([^;]*)/i);
                    var passMatch = trimmed.match(/P:([^;]*)/i);
                    var ssid = ssidMatch ? ssidMatch[1] : 'Unknown';
                    var pass = passMatch ? passMatch[1] : '';
                    renderResult('📶', 'Wi-Fi Network', 'SSID: ' + ssid, detectedFormat,
                        '<span class="label">SSID</span><span class="value cyan">' + ssid + '</span>' +
                        '<span class="label" style="margin-top:6px;">Password</span><span class="value gold">' +
                        pass + '</span>' +
                        rawHtml, [
                            { label: 'Copy Password', primary: true, action: function() { copyText(pass); } },
                            { label: 'Copy SSID', primary: false, action: function() { copyText(ssid); } },
                            { label: 'Copy Raw', primary: false, action: function() { copyText(trimmed); } }
                        ]);
                    return;
                }

                // URL
                if (/^https?:\/\/[^\s]+/.test(trimmed)) {
                    var isSecure = /^https:\/\//i.test(trimmed);
                    renderResult('🔗', 'Hyperlink', 'Secure link', detectedFormat,
                        '<span class="label">URL</span><span class="value" style="word-break:break-all;color:var(--cyan);">' +
                        trimmed + '</span>' +
                        (isSecure ?
                            '<span class="label" style="margin-top:6px;">Protocol</span><span class="value green">✅ HTTPS</span>' :
                            '<span class="label" style="margin-top:6px;">Protocol</span><span class="value" style="color:var(--gold);">⚠️ HTTP</span>'
                            ) +
                        rawHtml, [
                            { label: 'Open Link', primary: true, action: function() { window.open(trimmed,
                                    '_blank'); } },
                            { label: 'Copy URL', primary: false, action: function() { copyText(trimmed); } },
                            { label: 'Copy Raw', primary: false, action: function() { copyText(trimmed); } }
                        ]);
                    return;
                }

                // vCard
                if (/BEGIN:VCARD/i.test(trimmed)) {
                    var nameMatch = trimmed.match(/FN:([^\r\n]*)/i) || trimmed.match(/N:([^\r\n]*)/i);
                    var phoneMatch = trimmed.match(/TEL[^:]*:([^\r\n]*)/i);
                    var emailMatch = trimmed.match(/EMAIL[^:]*:([^\r\n]*)/i);
                    var name = nameMatch ? nameMatch[1].trim() : 'Unknown';
                    var phone = phoneMatch ? phoneMatch[1].trim() : '';
                    var email = emailMatch ? emailMatch[1].trim() : '';
                    renderResult('👤', 'Contact Card', name, detectedFormat,
                        '<span class="label">Name</span><span class="value cyan">' + name + '</span>' +
                        (phone ? '<span class="label" style="margin-top:6px;">Phone</span><span class="value gold">' +
                            phone + '</span>' : '') +
                        (email ? '<span class="label" style="margin-top:6px;">Email</span><span class="value">' +
                            email + '</span>' : '') +
                        rawHtml, [
                            { label: 'Copy All', primary: true, action: function() { copyText(name + ' | ' +
                                    phone + ' | ' + email); } },
                            { label: 'Copy Raw', primary: false, action: function() { copyText(trimmed); } }
                        ]);
                    return;
                }

                // Raw default
                renderResult('📄', 'Raw Data', 'Extracted text', detectedFormat,
                    '<span class="label">Text</span><span class="value" style="word-break:break-all;">' + trimmed +
                    '</span>' + rawHtml, [
                        { label: 'Copy Text', primary: true, action: function() { copyText(trimmed); } },
                        { label: 'Search', primary: false, action: function() { window.open(
                                    'https://www.google.com/search?q=' + encodeURIComponent(trimmed),
                                '_blank'); } }
                    ]);
            }

            function renderResult(icon, title, sub, format, bodyHTML, actions) {
                resIcon.textContent = icon || '📱';
                resTitle.textContent = title || 'Scan Result';
                resSub.textContent = sub || 'Decoded payload';
                resFormat.textContent = format || 'Unknown';
                resBody.innerHTML = bodyHTML || '<span style="color:var(--muted);">No data</span>';
                resActions.innerHTML = '';
                if (actions && actions.length) {
                    actions.forEach(function(a) {
                        var btn = document.createElement('button');
                        btn.className = 'act ' + (a.primary ? 'act-primary' : 'act-secondary');
                        btn.textContent = a.label;
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (typeof a.action === 'function') a.action();
                            closeResultPopup();
                        });
                        resActions.appendChild(btn);
                    });
                }
                resultOverlay.classList.add('active');
            }

            function copyText(text) {
                if (!text) { showToast('⚠️ Nothing to copy', 1500); return; }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function() { showToast('✅ Copied!', 1500); }).catch(
                    function() { fallbackCopy(text); });
                } else { fallbackCopy(text); }
            }

            function fallbackCopy(text) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy');
                    showToast('✅ Copied!', 1500); } catch (e) { showToast('⚠️ Copy failed.', 2000); }
                document.body.removeChild(ta);
            }

            // ============================================================
            //  PWA INSTALL (replaces download)
            // ============================================================
            let deferredPrompt;

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('install-btn').classList.remove('hidden');
            });

            window.addEventListener('appinstalled', () => {
                document.getElementById('install-btn').classList.add('hidden');
                showToast('✅ App installed!', 'success');
            });

            window.installApp = function() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            showToast('✅ App installed!', 'success');
                        } else {
                            showToast('❌ Cancelled', 'error');
                        }
                        deferredPrompt = null;
                        document.getElementById('install-btn').classList.add('hidden');
                    });
                } else {
                    showToast('📱 Use browser menu → "Add to Home screen"', 2500);
                }
            };

            // ============================================================
            //  INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                try {
                    var stored = localStorage.getItem('nightorbit_forensic_log');
                    if (stored) scanLog = JSON.parse(stored);
                } catch (e) {}

                setStatus('idle', 'Ready');
                setTimeout(function() { initScanner(); }, 500);

                if (window.matchMedia('(display-mode: standalone)').matches) {
                    document.getElementById('install-btn').classList.add('hidden');
                }

                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible' && !cameraActive && isScanning) {
                        startCamera();
                    }
                });
            });

            window.addEventListener('beforeunload', function() {
                if (html5QrCode) { try { html5QrCode.stop(); } catch (e) {} try { html5QrCode.clear(); } catch (
                    e) {} }
            });

            // Expose
            window.startCamera = startCamera;
            window.stopCamera = stopCamera;
            window.toggleCamera = toggleCamera;
            window.toggleTorch = toggleTorch;
            window.resetScanner = resetScanner;
            window.handleFileUpload = handleFileUpload;
            window.closeResultPopup = closeResultPopup;
            window.showToast = showToast;
            window.forensicParse = forensicParse;
            window.installApp = window.installApp;

        })();
    </script>
