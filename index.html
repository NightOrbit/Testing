}

function extractTitle(html){
  var m=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  return m?m[1].trim():"Original Web";
}

  m=html.match(/<link[^>]*href=["']([^"']+)["'][^>]*rel=["'](?:icon|shortcut icon|apple-touch-icon)["']/i);
  return m?m[1]:null;
}

function applyOriginalBranding(html){
  var title=extractTitle(html);
  document.title=title;
  var fav=extractFavicon(html);
  if(fav){
    var link=document.querySelector("link[rel*='icon']")||document.createElement("link");
    link.rel="icon";
    link.href=fav;
    document.head.appendChild(link);
  }
}

function injectBlocker(html){
  html = html.replace(/<noscript[\s\S]*?<\/noscript>/gi, "");
  html = html.replace(/<meta[^>]*http-equiv=["']refresh["'][^>]*>/gi, "");
  var css = "<style>" +
    "*{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}" +
    "input,textarea,select{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;}" +
    "<\/style>";
  var js = "<scr"+"ipt>" +
    "(function(){" +
      "function isEd(el){if(!el||!el.tagName)return false;var t=el.tagName.toLowerCase();return t==='input'||t==='textarea'||t==='select'||el.isContentEditable;}" +
      "document.addEventListener('contextmenu',function(e){if(isEd(e.target))return true;e.preventDefault();return false;},{capture:true});" +
      "document.addEventListener('selectstart',function(e){if(isEd(e.target))return true;e.preventDefault();return false;},{capture:true});" +
      "document.addEventListener('copy',function(e){if(isEd(e.target))return true;e.preventDefault();return false;},{capture:true});" +
      "document.addEventListener('cut',function(e){if(isEd(e.target))return true;e.preventDefault();return false;},{capture:true});" +
      "document.addEventListener('dragstart',function(e){if(isEd(e.target))return true;e.preventDefault();return false;},{capture:true});" +
      "document.addEventListener('keydown',function(e){" +
        "var t=e.target;var tag=t&&t.tagName?t.tagName.toLowerCase():'';" +
        "var ed=(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable));" +
        "if(e.key==='F12'||e.keyCode===123){e.preventDefault();return false;}" +
        "if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='C'||e.keyCode===73||e.keyCode===74||e.keyCode===67)){e.preventDefault();return false;}" +
        "if(e.ctrlKey&&(e.key==='U'||e.keyCode===85)){e.preventDefault();return false;}" +
        "if(e.ctrlKey&&!ed&&(e.key==='C'||e.key==='A'||e.key==='S'||e.keyCode===67||e.keyCode===65||e.keyCode===83)){e.preventDefault();return false;}" +
        "if(!ed&&(e.key==='Backspace'||e.key==='Tab')){e.preventDefault();return false;}" +
      "},{capture:true});" +
    "})();" +
  "<\/scr"+"ipt>";
  if(html.indexOf("</head>")!==-1){html=html.replace("</head>",css+"</head>");}else{html=css+html;}
  if(html.indexOf("</body>")!==-1){html=html.replace("</body>",js+"</body>");}else{html=html+js;}
  return html;
}

function renderHTML(htmlContent){
  var loader=document.getElementById("loader");
  if(loader)loader.style.display="none";
  applyOriginalBranding(htmlContent);
  var finalHTML=injectBlocker(htmlContent);
  var iframe=document.createElement("iframe");
  iframe.id="renderFrame";
  iframe.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation");
  document.body.appendChild(iframe);
  try{
    iframe.srcdoc=finalHTML;
  }catch(e){
    try{
      var blob=new Blob([finalHTML],{type:"text/html;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      iframe.removeAttribute("srcdoc");
      iframe.src=url;
    }catch(e2){
      showError("Render failed: "+e2.message);
    }
  }
  setTimeout(function(){try{iframe.focus();}catch(e){}},100);
}

function renderText(textContent){
  document.title="Decrypted Text";
  document.body.innerHTML="";
  document.body.style.cssText="background:#000;color:#00ff64;font-family:\"Courier New\",monospace;padding:20px;margin:0;font-size:13px;line-height:1.6;";
  var pre=document.createElement("pre");
  pre.style.cssText="margin:0;white-space:pre-wrap;word-break:break-word;";
  pre.textContent=textContent;
  document.body.appendChild(pre);
}

function renderBundle(bundle){
  document.title="Bundle ("+bundle.__fileCount+" Files)";
  document.body.innerHTML="";
  document.body.style.cssText="background:#0b0b1a;color:#fff;font-family:monospace;padding:20px;margin:0;min-height:100vh;";
  var h="<div class=\"bundle-wrap\">";
  h+="<div class=\"bundle-title\">📦 Multi-File Bundle ("+bundle.__fileCount+" files)<\/div>";
  Object.keys(bundle.files).forEach(function(name){
    var f=bundle.files[name];
    h+="<div class=\"file-card\">";
    h+="<div class=\"file-head\"><span class=\"file-name\">📄 "+name+"<\/span><span class=\"file-lang\">"+(f.lang||"?").toUpperCase()+"<\/span><\/div>";
    h+="<pre class=\"file-content\">"+f.content.replace(/</g,"&lt;")+"<\/pre>";
    h+="<button class=\"dl-btn\" data-name=\""+name+"\">⬇ Download "+name+"<\/button>";
    h+="<\/div>";
  });
  h+="<\/div>";
  document.body.innerHTML=h;
  document.body.querySelectorAll(".dl-btn").forEach(function(b){
    b.addEventListener("click",function(){
      var name=this.getAttribute("data-name");
      var f=bundle.files[name];
      var blob=new Blob([f.content],{type:"text/plain;charset=utf-8"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=name;
      a.click();
    });
  });
}

ready(function(){
  if(typeof CryptoJS==="undefined"){
    showError("CryptoJS library failed to load. Check your internet connection.");
    return;
  }
  setTimeout(function(){
    if(!window._0xSECRET || window._0xSECRET.length < 30){
      showKeyMissingError();
      return;
    }
    try{
      var dec=CryptoJS.AES.decrypt(ENCRYPTED_DATA,window._0xSECRET).toString(CryptoJS.enc.Utf8);
      if(!dec||dec.length===0){throw new Error("Decryption failed - wrong key or corrupted data.");}

      var isBundle=false,bundle=null;
      try{
        var p=JSON.parse(dec);
        if(p&&p.__type==="multi-file-bundle"){isBundle=true;bundle=p;}
      }catch(e){}

      if(isBundle){
        renderBundle(bundle);
      } else {
        var trimmed=dec.trim();
        var isHTML=/^\s*<!DOCTYPE\s+html/i.test(trimmed)||/<html[\s>]/i.test(trimmed)||/<head[\s>]/i.test(trimmed)||/<body[\s>]/i.test(trimmed)||/<div[\s>]/i.test(trimmed);
        if(isHTML){
          renderHTML(dec);
        } else {
          renderText(dec);
        }
      }
    }catch(e){
      showError(e.message);
    }
  }, 500);
});
</script>
