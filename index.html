<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gyidi Bazar Hub</title>
    
    <!-- ============================================================
         🔒 ULTIMATE SHORTCUTS BLOCK - KOE BHI KAAM NAHI KAREGA
         ============================================================ -->
    <script>
        (function() {
            'use strict';
            
            // ============================================
            // 🔥 SAB SHORTCUTS BLOCK - HAR KEY
            // ============================================
            function blockAllKeys(e) {
                var key = e.key;
                var code = e.keyCode;
                var ctrl = e.ctrlKey;
                var shift = e.shiftKey;
                var alt = e.altKey;
                var meta = e.metaKey;
                
                // ===== ALL F-KEYS (F1-F12) =====
                if (key && key.startsWith('F') && key.length <= 3) {
                    var num = parseInt(key.replace('F', ''));
                    if (num >= 1 && num <= 12) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                }
                
                // ===== INDIVIDUAL KEYS =====
                if (key === 'F12' || code === 123) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                if (key === 'PrintScreen' || code === 44) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                if (key === 'Insert' || code === 45) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                if (key === 'Home' || code === 36) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                if (key === 'PageUp' || key === 'PageDown' || code === 33 || code === 34) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                // ===== CTRL+... SAB BLOCK =====
                if (ctrl) {
                    var c = key ? key.toUpperCase() : '';
                    
                    // CTRL+A to Z - SAB BLOCK
                    if (c.length === 1 && c >= 'A' && c <= 'Z') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+0-9 - SAB BLOCK
                    if (c >= '0' && c <= '9') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+U (View Source)
                    if (c === 'U') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+S (Save Page)
                    if (c === 'S') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // Special keys
                    if (['`', '-', '=', '[', ']', '\\', ';', "'", ',', '.', '/'].includes(key)) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                }
                
                // ===== CTRL+SHIFT+... SAB BLOCK =====
                if (ctrl && shift) {
                    var c = key ? key.toUpperCase() : '';
                    
                    // CTRL+SHIFT+I (Inspect), CTRL+SHIFT+J (Console), CTRL+SHIFT+C
                    if (c === 'I' || c === 'J' || c === 'C') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+SHIFT+P (Command Palette)
                    if (c === 'P') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+SHIFT+E (Network)
                    if (c === 'E') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+SHIFT+K (Console Firefox)
                    if (c === 'K') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // CTRL+SHIFT+A-Z - SAB BLOCK
                    if (c.length === 1 && c >= 'A' && c <= 'Z') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                }
                
                // ===== ALT+... SAB BLOCK =====
                if (alt) {
                    var c = key ? key.toUpperCase() : '';
                    
                    if (c.length === 1 && c >= 'A' && c <= 'Z') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // ALT+F4
                    if (key === 'F4' || code === 115) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                }
                
                // ===== MAC - CMD+... SAB BLOCK =====
                if (meta) {
                    var c = key ? key.toUpperCase() : '';
                    
                    if (c.length === 1 && c >= 'A' && c <= 'Z') {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                    
                    // Mac: Cmd+Alt+I, Cmd+Alt+J, Cmd+Alt+C
                    if (alt && (c === 'I' || c === 'J' || c === 'C')) {
                        e.preventDefault();
                        e.stopPropagation();
                        e.stopImmediatePropagation();
                        return false;
                    }
                }
                
                // ===== BROWSER SHORTCUTS =====
                // Backspace (browser back)
                if (key === 'Backspace' && !e.target.matches('input, textarea, select')) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                // Escape
                if (key === 'Escape' || code === 27) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                // Tab
                if (key === 'Tab' || code === 9) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
                
                return true;
            }
            
            // ===== ATTACH - CAPTURE PHASE (sab se pehle) =====
            document.addEventListener('keydown', blockAllKeys, { capture: true, passive: false });
            window.addEventListener('keydown', blockAllKeys, { capture: true, passive: false });
            
            // ===== RIGHT CLICK BLOCK =====
            document.addEventListener('contextmenu', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                return false;
            }, { capture: true });
            
            // ===== CONSOLE BLOCK =====
            try {
                var empty = function() {};
                var consoleMethods = [
                    'log', 'warn', 'error', 'info', 'debug', 'trace',
                    'group', 'groupEnd', 'table', 'clear', 'dir',
                    'dirxml', 'profile', 'profileEnd', 'time',
                    'timeEnd', 'timeStamp', 'memory', 'assert',
                    'count', 'countReset'
                ];
                consoleMethods.forEach(function(m) {
                    try {
                        window.console[m] = empty;
                    } catch(e) {}
                });
                window.console.clear = empty;
            } catch(e) {}
            
            // ===== SELECT/DRAG/COPY BLOCK =====
            document.addEventListener('selectstart', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
                    e.preventDefault();
                    return false;
                }
            }, { capture: true });
            
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            }, { capture: true });
            
            document.addEventListener('copy', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
                    e.preventDefault();
                    return false;
                }
            }, { capture: true });
            
            document.addEventListener('cut', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
                    e.preventDefault();
                    return false;
                }
            }, { capture: true });
            
            document.addEventListener('paste', function(e) {
                var tag = e.target.tagName.toLowerCase();
                if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
                    e.preventDefault();
                    return false;
                }
            }, { capture: true });
            
            // ===== MIDDLE CLICK BLOCK =====
            document.addEventListener('auxclick', function(e) {
                if (e.button === 1) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    return false;
                }
            }, { capture: true });
            
            // ===== DEVTOOLS DETECTION =====
            setInterval(function() {
                var threshold = 100;
                if (window.outerWidth - window.innerWidth > threshold || 
                    window.outerHeight - window.innerHeight > threshold) {
                    try { 
                        console.clear(); 
                    } catch(e) {}
                }
            }, 500);
            
            // ===== BLOCK eval() =====
            try {
                delete window.eval;
                window.eval = function() { return null; };
                Object.defineProperty(window, 'eval', {
                    value: function() { return null; },
                    writable: false,
                    configurable: false
                });
            } catch(e) {}
            
            // ===== BLOCK document.write and print =====
            try {
                document.write = function() { return; };
                window.print = function() { return; };
            } catch(e) {}
            
            console.log('✅ ULTIMATE SECURITY - SAB SHORTCUTS BLOCK ACTIVE');
        })();
    </script>
    
    <!-- ============================================================
         🔥 FIREBASE SDK
         ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <!-- ============================================================
         🔥 EMAILJS
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <!-- ============================================================
         🔥 FINGERPRINT
         ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/fingerprintjs@2/dist/fingerprint2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js@1.0.2/dist/ua-parser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
</head>
<body>
    <!-- ============================================================
         🔥 LOADING OVERLAY
         ============================================================ -->
    <div id="loading-overlay" style="position:fixed;inset:0;background:#0b0b1a;display:flex;align-items:center;justify-content:center;z-index:999999;">
        <div style="text-align:center;">
            <div style="width:50px;height:50px;border:5px solid #333;border-top:5px solid #00f0ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px;"></div>
            <div style="font-size:12px;color:#00f0ff;letter-spacing:2px;font-weight:bold;text-transform:uppercase;" id="loader-status-text">INITIALIZING...</div>
        </div>
    </div>
    
    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0b1a; font-family:'Inter',sans-serif; color:#fff; min-height:100vh; }
        #loading-overlay { display:flex; }
    </style>
    
    <!-- ============================================================
         🔥 MAIN LOADER - code.json SE SAB LOAD KAREGA
         ============================================================ -->
    <script>
        // ============================================================
        //  🔥 LOAD CODE.JSON
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log("🚀 Loading code.json...");
            
            // Loading status update
            document.getElementById('loader-status-text').textContent = 'LOADING...';
            
            fetch('code.json')
                .then(response => {
                    console.log("📡 Response status:", response.status);
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status + ' - code.json not found');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("✅ code.json loaded successfully!");
                    document.getElementById('loader-status-text').textContent = 'INITIALIZING FIREBASE...';
                    
                    // ============================================================
                    //  🔥 FIREBASE INITIALIZE
                    // ============================================================
                    const firebaseConfig = data.config.firebase;
                    firebase.initializeApp(firebaseConfig);
                    console.log("✅ Firebase initialized!");
                    document.getElementById('loader-status-text').textContent = 'INJECTING HTML...';
                    
                    // ============================================================
                    //  🔥 HTML INJECT
                    // ============================================================
                    document.body.innerHTML = data.html;
                    console.log("✅ HTML injected!");
                    document.getElementById('loader-status-text').textContent = 'INJECTING CSS...';
                    
                    // ============================================================
                    //  🔥 CSS INJECT
                    // ============================================================
                    const styleTag = document.createElement('style');
                    styleTag.textContent = data.css;
                    document.head.appendChild(styleTag);
                    console.log("✅ CSS injected!");
                    document.getElementById('loader-status-text').textContent = 'EXECUTING JS...';
                    
                    // ============================================================
                    //  🔥 JS EXECUTE
                    // ============================================================
                    eval(data.js);
                    console.log("✅ JavaScript executed!");
                    console.log("🎉 App Loaded Successfully!");
                    
                    // ============================================================
                    //  🔥 LOADING HATAAO (waise bhi JS mein hide ho jayega)
                    // ============================================================
                    setTimeout(function() {
                        var loading = document.getElementById('loading-overlay');
                        if (loading) {
                            loading.style.display = 'none';
                        }
                    }, 500);
                })
                .catch(err => {
                    console.error("❌ Error loading app:", err);
                    document.getElementById('loader-status-text').textContent = 'ERROR';
                    
                    var loading = document.getElementById('loading-overlay');
                    if (loading) {
                        loading.innerHTML = `
                            <div style="text-align:center;color:#ff4444;max-width:400px;padding:20px;">
                                <div style="font-size:48px;margin-bottom:15px;">⚠️</div>
                                <div style="font-size:16px;font-weight:bold;margin-bottom:10px;">Loading Error</div>
                                <div style="font-size:13px;color:#888;margin-bottom:8px;">${err.message}</div>
                                <div style="font-size:11px;color:#555;">Try refreshing the page</div>
                                <button onclick="location.reload()" style="margin-top:15px;padding:10px 30px;background:#00f0ff;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">REFRESH</button>
                            </div>
                        `;
                    }
                });
        });
    </script>
</body>
</html>
